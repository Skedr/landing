name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_ENV: test
  PUBLIC_FLICKR_KEY: ${{ secrets.PUBLIC_FLICKR_KEY }}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Verify Sharp image processing
      run: pnpm exec node --input-type=module -e "import sharp from 'sharp'; await sharp({ create:{ width:1, height:1, channels:3, background:'white' } }).webp().toBuffer();"
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Build to be able to preview
      run: pnpm run build 
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
