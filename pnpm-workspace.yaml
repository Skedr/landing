# This is a single-package repository; no app/API packages are included.
allowBuilds:
  esbuild: true
  sharp: true
  fsevents: false

# Typography still pins a vulnerable 6.0.x selector parser. Stay on its major
# version while applying the CPU-exhaustion security fix.
overrides:
  "@tailwindcss/typography>postcss-selector-parser": 6.1.5

# Builds must not silently resolve or install a different dependency tree.
verifyDepsBeforeRun: error
